<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">

  <!-- Outer encompassing circle (Corporate Green) — transparent background -->
  <circle cx="100" cy="100" r="92" stroke="#00a651" stroke-width="6"/>
  <circle cx="100" cy="100" r="85" stroke="#00a651" stroke-width="1.5"/>

  <!-- Rising Sun (Corporate Red) — upper section -->
  <line x1="100" y1="22" x2="100" y2="12" stroke="#ed1c24" stroke-width="4" stroke-linecap="round"/>
  <line x1="122" y1="30" x2="130" y2="22" stroke="#ed1c24" stroke-width="4" stroke-linecap="round"/>
  <line x1="135" y1="52" x2="145" y2="48" stroke="#ed1c24" stroke-width="4" stroke-linecap="round"/>
  <line x1="129" y1="76" x2="138" y2="83" stroke="#ed1c24" stroke-width="4" stroke-linecap="round"/>
  <line x1="78" y1="30" x2="70" y2="22" stroke="#ed1c24" stroke-width="4" stroke-linecap="round"/>
  <line x1="65" y1="52" x2="55" y2="48" stroke="#ed1c24" stroke-width="4" stroke-linecap="round"/>
  <line x1="71" y1="76" x2="62" y2="83" stroke="#ed1c24" stroke-width="4" stroke-linecap="round"/>
  <line x1="100" y1="90" x2="100" y2="100" stroke="#ed1c24" stroke-width="4" stroke-linecap="round"/>
