  <!-- Wall body -->
  <rect x="54" y="108" width="92" height="14" fill="#00a651"/>

  <!-- Blue Flame (#0089cf) — lower section -->
  <path d="M100 126 C90 117 80 119 80 134 C80 150 90 162 100 166 C110 162 120 150 120 134 C120 119 110 117 100 126Z" fill="#0089cf"/>
  <path d="M100 137 C94 131 90 133 90 141 C90 150 95 158 100 161 C105 158 110 150 110 141 C110 133 106 131 100 137Z" fill="#afd9f4"/>
  <path d="M100 147 C97 144 95 146 95 150 C95 155 97 159 100 160 C103 159 105 155 105 150 C105 146 103 144 100 147Z" fill="white" opacity="0.85"/>
